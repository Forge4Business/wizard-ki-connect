<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Wizard-KI-Connect{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --wizard-blue:#0072c6; --wizard-orange:#ff6600; }
        body { min-height:100vh; font-family:Inter,sans-serif; color:#fff; background:radial-gradient(circle at top right,#004b87,#001a33); }
        .navbar { background:rgba(0,26,51,.9); border-bottom:1px solid rgba(255,255,255,.15); }
        .brand { color:#fff; font-weight:800; text-decoration:none; }
        .brand span { color:var(--wizard-orange); }
        .glass { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.13); border-radius:1rem; box-shadow:0 8px 28px rgba(0,0,0,.22); }
        .btn-wizard { background:var(--wizard-orange); color:#fff; border:0; font-weight:700; }
        .btn-wizard:hover { background:#df5900; color:#fff; }
        .text-soft { color:#b9c6d2; }
        .form-control,.form-select { background:#fff; color:#111; }
        .feed-image { max-height:360px; width:100%; object-fit:contain; background:rgba(0,0,0,.2); }
    </style>
</head>
<body>
<nav class="navbar py-3">
    <div class="container d-flex justify-content-between">
        <a class="brand" href="{{ url_for('web.index') }}">🧙 Wizard-KI-Connect <span>v4</span></a>
        {% if current_user %}
        <form method="post" action="{{ url_for('web.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn btn-sm btn-outline-light" type="submit">Abmelden</button>
        </form>
        {% endif %}
    </div>
</nav>
<main class="container py-4">
    {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
