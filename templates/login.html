{% extends "base.html" %}
{% block title %}Login · Wizard-KI-Connect{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-6 col-lg-4">
    <form class="glass p-4" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h2 class="h3 fw-bold mb-4">Willkommen zurück</h2>
        <label class="form-label" for="username">Benutzername</label>
        <input class="form-control mb-3" id="username" name="username" autocomplete="username" required>
        <label class="form-label" for="password">Passwort</label>
        <input class="form-control mb-4" id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="btn btn-wizard w-100" type="submit">Einloggen</button>
        <p class="small text-soft mt-3 mb-0">Testkonto: irsan / admin123</p>
    </form>
</div></div>
{% endblock %}
